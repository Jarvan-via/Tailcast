server {
    listen 80;
    listen [::]:80;
    server_name www.wortenprice.com;

    root /home/homepage/autopricy/dist;

    access_log /var/log/nginx/www.wortenprice.com.redirect.access.log;
    error_log  /var/log/nginx/www.wortenprice.com.redirect.error.log;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location = / { return 301 https://autopricy.com/; }
    location = /tiaojia.html { return 301 https://autopricy.com/zh/multi-marketplace-repricing/; }
    location = /zidong-tiaojia.html { return 301 https://autopricy.com/zh/features/automatic-repricing/; }
    location = /jingzheng-tiaojia.html { return 301 https://autopricy.com/zh/features/automatic-repricing/; }
    location = /piliang-tiaojia.html { return 301 https://autopricy.com/zh/features/multi-store-management/; }
    location = /robots.txt { return 301 https://autopricy.com/robots.txt; }
    location = /sitemap.xml { return 301 https://autopricy.com/sitemap.xml; }
    location / { return 410; }
}
